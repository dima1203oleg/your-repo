metadata:
  id: "performance-load-2025-12-01"
  created_by: "gemini-studio"
  target_env: "dev-local"
  created_at: "2025-12-01T11:00:00Z"
  
spec:
  scenario: "performance-test"
  description: "Load test API endpoints and measure performance"
  
  commands:
    - "helm upgrade --install platform-dev-local infra/helm/platform --values infra/helm/platform/values-dev.yaml --namespace predator-dev --create-namespace"
    - "npm run build"
    - "npm run preview &"
    - "sleep 30"
    - "k6 run tests/performance/api-load.js"
    - "curl -s http://localhost:3000/metrics | grep 'http_request_duration_seconds'"
    - "kubectl top pods -n predator-dev"
    - "kubectl get nodes -o wide"
  
  success_criteria:
    - "k6: error rate < 1%"
    - "k6: 95th percentile < 500ms"
    - "k8s: CPU < 80%"
    - "k8s: Memory < 80%"
  
  timeout: "20m"
  
  retry_policy:
    max_retries: 1
    backoff: "linear"
    
  artifacts:
    metrics: true
    reports: ["k6-report", "resource-usage"]
