apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: predator-secrets
  namespace: pa-dev
  labels:
    app.kubernetes.io/managed-by: examples
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: predator-secrets
    creationPolicy: Owner
  data:
    - secretKey: database-url
      remoteRef:
        key: secret/data/predator/database
        property: database_url
    - secretKey: redis-url
      remoteRef:
        key: secret/data/predator/redis
        property: redis_url
    - secretKey: postgres-password
      remoteRef:
        key: secret/data/predator/database
        property: postgres_password
    - secretKey: redis-password
      remoteRef:
        key: secret/data/predator/redis
        property: redis_password
    - secretKey: grafana-admin-password
      remoteRef:
        key: secret/data/predator/grafana
        property: admin_password

# NOTE:
# - Ensure the ClusterSecretStore `vault-backend` exists and is configured to talk to your Vault.
# - Vault paths above assume KV v2 paths like secret/data/<path>. Adjust key/property for your Vault layout.