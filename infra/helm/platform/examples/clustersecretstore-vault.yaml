apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
  annotations:
    # adjust if you store different annotation metadata
    managed-by: examples
spec:
  provider:
    vault:
      # address: http://vault.example:8200  <- set in Secret or external config
      server: "https://vault.example"
      # authentication method; here we show token and kubernetes examples
      # token:
      #   secretRef:
      #     namespace: external-secrets
      #     name: vault-token
      #     key: token
      # kubernetes auth example
      auth:
        kubernetes:
          # service account token path inside the cluster
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          role: "external-secrets-role"
          serviceAccountRef:
            name: external-secrets-sa

      caProvider:
        # optional: use Kubernetes secret containing CA or leave default
        secretRef:
          name: vault-ca
          namespace: external-secrets