apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: predator-secrets
  namespace: pa-dev
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: predator-secrets
    creationPolicy: Owner
  data:
    - secretKey: database-url
      remoteRef:
        key: secret/data/predator/database
        property: database_url
    - secretKey: redis-url
      remoteRef:
        key: secret/data/predator/redis
        property: redis_url
    - secretKey: postgres-password
      remoteRef:
        key: secret/data/predator/database
        property: postgres_password
    - secretKey: redis-password
      remoteRef:
        key: secret/data/predator/redis
        property: redis_password
    - secretKey: grafana-admin-password
      remoteRef:
        key: secret/data/predator/grafana
        property: admin_password
# Note: adjust remoteRef.key paths and properties to match your Vault layout.
