{{- if .Values.devmode.createPredatorSecrets }}
apiVersion: v1
kind: Secret
metadata:
  name: predator-secrets
  labels:
    app.kubernetes.io/name: {{ include "platform.name" . | quote }}
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
type: Opaque
stringData:
  database-url: {{ .Values.devmode.predatorSecrets.databaseUrl | quote }}
  redis-url: {{ .Values.devmode.predatorSecrets.redisUrl | quote }}
  postgres-password: {{ .Values.devmode.predatorSecrets.postgresPassword | quote }}
  redis-password: {{ .Values.devmode.predatorSecrets.redisPassword | quote }}
  grafana-admin-password: {{ .Values.devmode.predatorSecrets.grafanaAdminPassword | quote }}
{{- end }}
