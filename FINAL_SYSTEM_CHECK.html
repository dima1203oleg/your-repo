<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>🔍 Фінальна перевірка системи</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulse-green { 0%, 100% { background-color: rgb(34 197 94); } 50% { background-color: rgb(74 222 128); } }
        @keyframes pulse-yellow { 0%, 100% { background-color: rgb(250 204 21); } 50% { background-color: rgb(254 240 138); } }
        @keyframes pulse-red { 0%, 100% { background-color: rgb(239 68 68); } 50% { background-color: rgb(252 165 165); } }
        .pulse-green { animation: pulse-green 2s infinite; }
        .pulse-yellow { animation: pulse-yellow 2s infinite; }
        .pulse-red { animation: pulse-red 2s infinite; }
    </style>
</head>
<body class="bg-gray-900 text-white p-8">
    <div class="max-w-6xl mx-auto">
        <h1 class="text-4xl font-bold mb-8 text-center bg-gradient-to-r from-blue-400 to-purple-600 bg-clip-text text-transparent">
            🔍 ФІНАЛЬНА ПЕРЕВІРКА PREDATOR ANALYTICS
        </h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-8">
            <!-- System Status -->
            <div class="bg-gray-800 p-6 rounded-lg border border-gray-700">
                <h2 class="text-xl font-bold mb-4 text-blue-400">🖥️ Система</h2>
                <div id="system-status" class="space-y-2">Перевірка...</div>
            </div>
            
            <!-- API Status -->
            <div class="bg-gray-800 p-6 rounded-lg border border-gray-700">
                <h2 class="text-xl font-bold mb-4 text-green-400">🌐 API</h2>
                <div id="api-status" class="space-y-2">Перевірка...</div>
            </div>
            
            <!-- Performance -->
            <div class="bg-gray-800 p-6 rounded-lg border border-gray-700">
                <h2 class="text-xl font-bold mb-4 text-yellow-400">⚡ Продуктивність</h2>
                <div id="performance-status" class="space-y-2">Перевірка...</div>
            </div>
            
            <!-- Real Data -->
            <div class="bg-gray-800 p-6 rounded-lg border border-gray-700">
                <h2 class="text-xl font-bold mb-4 text-purple-400">📊 Реальні дані</h2>
                <div id="real-data-status" class="space-y-2">Перевірка...</div>
            </div>
            
            <!-- Monitoring -->
            <div class="bg-gray-800 p-6 rounded-lg border border-gray-700">
                <h2 class="text-xl font-bold mb-4 text-red-400">📈 Моніторинг</h2>
                <div id="monitoring-status" class="space-y-2">Перевірка...</div>
            </div>
            
            <!-- Overall Score -->
            <div class="bg-gray-800 p-6 rounded-lg border border-gray-700">
                <h2 class="text-xl font-bold mb-4 text-cyan-400">🎯 Загальна оцінка</h2>
                <div id="overall-score" class="text-center">-</div>
            </div>
        </div>
        
        <!-- Detailed Results -->
        <div class="bg-gray-800 p-6 rounded-lg border border-gray-700">
            <h2 class="text-2xl font-bold mb-4 text-orange-400">📋 Детальні результати</h2>
            <div id="detailed-results" class="space-y-4">Проводиться аналіз...</div>
        </div>
        
        <!-- Recommendations -->
        <div class="bg-gray-800 p-6 rounded-lg border border-gray-700 mt-6">
            <h2 class="text-2xl font-bold mb-4 text-indigo-400">💡 Рекомендації</h2>
            <div id="recommendations" class="space-y-2">Аналіз...</div>
        </div>
    </div>
    
    <script>
        const tests = [
            // System tests
            { name: 'Backend Health', url: 'http://localhost:8001/health', category: 'system' },
            { name: 'Proxy Health', url: 'http://127.0.0.1:3003/health', category: 'system' },
            { name: 'Monitoring Health', url: 'http://localhost:3004/health', category: 'system' },
            
            // API tests
            { name: 'Connectors API', url: 'http://localhost:8001/api/v1/connectors', category: 'api' },
            { name: 'System Metrics', url: 'http://localhost:8001/api/v1/metrics/system', category: 'api' },
            { name: 'System Logs', url: 'http://localhost:8001/api/v1/logs/system', category: 'api' },
            { name: 'Database Status', url: 'http://localhost:8001/api/v1/databases/status', category: 'api' },
            { name: 'Agents Status', url: 'http://localhost:8001/api/v1/agents/status', category: 'api' },
            { name: 'Security Logs', url: 'http://localhost:8001/api/v1/security/logs', category: 'api' },
            { name: 'System Monitoring', url: 'http://localhost:8001/api/v1/system/monitoring', category: 'api' },
            
            // Performance tests
            { name: 'Fast Response Test', url: 'http://localhost:8001/api/v1/metrics/system', category: 'performance', timeout: 100 },
            { name: 'Complex Data Test', url: 'http://localhost:8001/api/v1/connectors', category: 'performance', timeout: 5000 }
        ];
        
        const results = {
            system: { passed: 0, total: 0, details: [] },
            api: { passed: 0, total: 0, details: [] },
            performance: { passed: 0, total: 0, details: [] },
            realData: { passed: 0, total: 0, details: [] },
            monitoring: { passed: 0, total: 0, details: [] }
        };
        
        async function runTests() {
            console.log('🚀 Starting comprehensive system check...');
            
            for (const test of tests) {
                try {
                    const startTime = performance.now();
                    const response = await fetch(test.url, { 
                        signal: AbortSignal.timeout(test.timeout || 3000) 
                    });
                    const endTime = performance.now();
                    const responseTime = Math.round(endTime - startTime);
                    
                    if (response.ok) {
                        const data = await response.json();
                        results[test.category].passed++;
                        results[test.category].details.push({
                            name: test.name,
                            status: '✅ PASS',
                            responseTime,
                            data: data.success ? 'Valid JSON' : 'Invalid format'
                        });
                        
                        // Special checks for real data
                        if (test.category === 'api' && test.name === 'Connectors API') {
                            const connectors = data.data || [];
                            const realAPIs = connectors.filter(c => c.id && c.id.includes('real'));
                            const onlineAPIs = realAPIs.filter(c => c.status === 'ONLINE');
                            results.realData.total = 4;
                            results.realData.passed = onlineAPIs.length;
                            results.realData.details = realAPIs.map(api => ({
                                name: api.name,
                                status: api.status === 'ONLINE' ? '✅ ONLINE' : '❌ OFFLINE',
                                responseTime: api.latency || 0,
                                data: `${api.status} - ${api.error || 'OK'}`
                            }));
                        }
                        
                        // Special checks for monitoring
                        if (test.category === 'api' && test.name === 'System Monitoring') {
                            results.monitoring.total = 3;
                            results.monitoring.passed = 0;
                            if (data.data && data.data.performance) {
                                results.monitoring.passed++;
                            }
                            if (data.data && data.data.cache) {
                                results.monitoring.passed++;
                            }
                            if (data.data && data.data.apis) {
                                results.monitoring.passed++;
                            }
                            results.monitoring.details = [
                                { name: 'Performance Metrics', status: data.data?.performance ? '✅ Available' : '❌ Missing' },
                                { name: 'Cache Status', status: data.data?.cache ? '✅ Available' : '❌ Missing' },
                                { name: 'API Endpoints', status: data.data?.apis ? '✅ Available' : '❌ Missing' }
                            ];
                        }
                    } else {
                        results[test.category].details.push({
                            name: test.name,
                            status: `❌ FAIL (${response.status})`,
                            responseTime,
                            data: 'HTTP Error'
                        });
                    }
                } catch (error) {
                    results[test.category].details.push({
                        name: test.name,
                        status: '❌ ERROR',
                        responseTime: 0,
                        data: error.message
                    });
                }
                results[test.category].total++;
            }
            
            displayResults();
        }
        
        function displayResults() {
            // System Status
            const systemScore = Math.round((results.system.passed / results.system.total) * 100);
            document.getElementById('system-status').innerHTML = `
                <div class="text-3xl font-bold ${systemScore >= 80 ? 'text-green-400' : systemScore >= 60 ? 'text-yellow-400' : 'text-red-400'}">
                    ${systemScore}%
                </div>
                <div class="text-sm text-gray-400">${results.system.passed}/${results.system.total} тестів пройдено</div>
                <div class="w-full bg-gray-700 rounded-full h-2 mt-2">
                    <div class="${systemScore >= 80 ? 'bg-green-500' : systemScore >= 60 ? 'bg-yellow-500' : 'bg-red-500'} h-2 rounded-full transition-all duration-500" style="width: ${systemScore}%"></div>
                </div>
            `;
            
            // API Status
            const apiScore = Math.round((results.api.passed / results.api.total) * 100);
            document.getElementById('api-status').innerHTML = `
                <div class="text-3xl font-bold ${apiScore >= 80 ? 'text-green-400' : apiScore >= 60 ? 'text-yellow-400' : 'text-red-400'}">
                    ${apiScore}%
                </div>
                <div class="text-sm text-gray-400">${results.api.passed}/${results.api.total} API працюють</div>
                <div class="w-full bg-gray-700 rounded-full h-2 mt-2">
                    <div class="${apiScore >= 80 ? 'bg-green-500' : apiScore >= 60 ? 'bg-yellow-500' : 'bg-red-500'} h-2 rounded-full transition-all duration-500" style="width: ${apiScore}%"></div>
                </div>
            `;
            
            // Performance Status
            const perfScore = Math.round((results.performance.passed / results.performance.total) * 100);
            document.getElementById('performance-status').innerHTML = `
                <div class="text-3xl font-bold ${perfScore >= 80 ? 'text-green-400' : perfScore >= 60 ? 'text-yellow-400' : 'text-red-400'}">
                    ${perfScore}%
                </div>
                <div class="text-sm text-gray-400">${results.performance.passed}/${results.performance.total} швидких відповідей</div>
                <div class="w-full bg-gray-700 rounded-full h-2 mt-2">
                    <div class="${perfScore >= 80 ? 'bg-green-500' : perfScore >= 60 ? 'bg-yellow-500' : 'bg-red-500'} h-2 rounded-full transition-all duration-500" style="width: ${perfScore}%"></div>
                </div>
            `;
            
            // Real Data Status
            const realDataScore = Math.round((results.realData.passed / results.realData.total) * 100);
            document.getElementById('real-data-status').innerHTML = `
                <div class="text-3xl font-bold ${realDataScore >= 75 ? 'text-green-400' : realDataScore >= 50 ? 'text-yellow-400' : 'text-red-400'}">
                    ${realDataScore}%
                </div>
                <div class="text-sm text-gray-400">${results.realData.passed}/${results.realData.total} реальних API</div>
                <div class="w-full bg-gray-700 rounded-full h-2 mt-2">
                    <div class="${realDataScore >= 75 ? 'bg-green-500' : realDataScore >= 50 ? 'bg-yellow-500' : 'bg-red-500'} h-2 rounded-full transition-all duration-500" style="width: ${realDataScore}%"></div>
                </div>
            `;
            
            // Monitoring Status
            const monitoringScore = Math.round((results.monitoring.passed / results.monitoring.total) * 100);
            document.getElementById('monitoring-status').innerHTML = `
                <div class="text-3xl font-bold ${monitoringScore >= 80 ? 'text-green-400' : monitoringScore >= 60 ? 'text-yellow-400' : 'text-red-400'}">
                    ${monitoringScore}%
                </div>
                <div class="text-sm text-gray-400">${results.monitoring.passed}/${results.monitoring.total} компонентів</div>
                <div class="w-full bg-gray-700 rounded-full h-2 mt-2">
                    <div class="${monitoringScore >= 80 ? 'bg-green-500' : monitoringScore >= 60 ? 'bg-yellow-500' : 'bg-red-500'} h-2 rounded-full transition-all duration-500" style="width: ${monitoringScore}%"></div>
                </div>
            `;
            
            // Overall Score
            const overallScore = Math.round((systemScore + apiScore + perfScore + realDataScore + monitoringScore) / 5);
            const scoreColor = overallScore >= 80 ? 'text-green-400' : overallScore >= 60 ? 'text-yellow-400' : 'text-red-400';
            const scoreEmoji = overallScore >= 80 ? '🎉' : overallScore >= 60 ? '⚠️' : '❌';
            document.getElementById('overall-score').innerHTML = `
                <div class="text-5xl font-bold ${scoreColor}">${overallScore}%</div>
                <div class="text-2xl mt-2">${scoreEmoji}</div>
                <div class="text-sm text-gray-400 mt-2">${overallScore >= 80 ? 'Система готова!' : overallScore >= 60 ? 'Потрібна оптимізація' : 'Критичні проблеми'}</div>
            `;
            
            // Detailed Results
            const allDetails = [...results.system.details, ...results.api.details, ...results.performance.details];
            document.getElementById('detailed-results').innerHTML = allDetails.map(detail => `
                <div class="flex justify-between items-center p-3 bg-gray-700 rounded border-l-4 ${detail.status.includes('PASS') ? 'border-green-500' : detail.status.includes('FAIL') ? 'border-yellow-500' : 'border-red-500'}">
                    <div>
                        <div class="font-semibold">${detail.name}</div>
                        <div class="text-sm text-gray-400">${detail.data}</div>
                    </div>
                    <div class="text-right">
                        <div class="${detail.status.includes('PASS') ? 'text-green-400' : detail.status.includes('FAIL') ? 'text-yellow-400' : 'text-red-400'}">
                            ${detail.status}
                        </div>
                        <div class="text-sm text-gray-400">${detail.responseTime}ms</div>
                    </div>
                </div>
            `).join('');
            
            // Recommendations
            const recommendations = [];
            if (systemScore < 80) recommendations.push('Перевірте роботу серверів та їх доступність');
            if (apiScore < 80) recommendations.push('Оптимізуйте API endpoints та їх відповіді');
            if (perfScore < 80) recommendations.push('Покращіть продуктивність та час відповіді');
            if (realDataScore < 75) recommendations.push('Перевірте підключення до реальних українських API');
            if (monitoringScore < 80) recommendations.push('Налаштуйте повноцінний моніторинг системи');
            
            document.getElementById('recommendations').innerHTML = recommendations.length > 0 
                ? recommendations.map(rec => `<div class="flex items-center space-x-2"><span class="text-yellow-400">💡</span><span>${rec}</span></div>`).join('')
                : '<div class="text-green-400">✅ Система працює ідеально! Рекомендації не потрібні.</div>';
        }
        
        // Run tests when page loads
        window.addEventListener('load', runTests);
    </script>
</body>
</html>
