name: CI Basic Checks
on:
  push:
    branches: [feature/*, ai/*, develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.11"

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
      agents: ${{ steps.changes.outputs.agents }}
      infra: ${{ steps.changes.outputs.infra }}
      docs: ${{ steps.changes.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'requirements.txt'
            frontend:
              - 'frontend/**'
              - 'package.json'
              - 'vite.config.ts'
            agents:
              - 'agents/**'
            infra:
              - 'infra/**'
            docs:
              - 'docs/**'

  lint-backend:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black flake8 mypy pytest pytest-cov
          
      - name: Run Black
        run: black --check backend/ --diff
        
      - name: Run Flake8
        run: flake8 backend/ --max-line-length=100 --ignore=E203,W503
        
      - name: Run MyPy
        run: mypy backend/ --ignore-missing-imports
        
      - name: Run Unit Tests
        run: |
          pytest backend/tests/unit/ \
            --cov=backend \
            --cov-report=xml \
            --cov-report=html \
            --junit-xml=junit-backend.xml
            
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          flags: backend
          name: backend-coverage

  lint-frontend:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run ESLint
        run: npm run lint -- --format=github
        
      - name: Run Prettier
        run: npm run format:check
        
      - name: Run TypeScript Check
        run: npm run type-check
        
      - name: Run Unit Tests
        run: |
          npm run test:unit \
            -- --coverage \
            --reporter=junit \
            --reporter=html \
            --outputFile=junit-frontend.xml
            
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          flags: frontend
          name: frontend-coverage

  lint-agents:
    needs: detect-changes
    if: needs.detect-changes.outputs.agents == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          cd agents
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install black flake8 mypy pytest pytest-cov
          
      - name: Run Linting
        run: |
          cd agents
          black --check . --diff
          flake8 . --max-line-length=100
          mypy . --ignore-missing-imports
          
      - name: Run Tests
        run: |
          cd agents
          pytest tests/ \
            --cov=agents \
            --cov-report=xml \
            --junit-xml=junit-agents.xml

  security-scan:
    needs: detect-changes
    if: needs.detect-changes.outputs.backend == 'true' || needs.detect-changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  notify-results:
    needs: [lint-backend, lint-frontend, lint-agents, security-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          channel: '#ci-cd'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
        if: always()
