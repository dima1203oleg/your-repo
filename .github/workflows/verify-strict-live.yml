name: Verify STRICT Live mode (manual)

on:
  workflow_dispatch:
    inputs:
      browser:
        description: 'Playwright browser to run (firefox|chromium|webkit)'
        required: false
        default: 'firefox'

jobs:
  verify-strict:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Start real backend
        run: |
          nohup node real-backend/server.js &> real-backend.log &

      - name: Serve dist with proxy
        run: |
          nohup node scripts/serve-with-proxy.js &> serve-proxy.log &

      - name: Wait for real backend health
        run: |
          for i in {1..30}; do
            if curl -sS http://127.0.0.1:8001/health >/dev/null 2>&1; then
              echo backend ready && break;
            fi
            sleep 1
          done

      - name: Wait for static server
        run: |
          for i in {1..30}; do
            if curl -sS http://127.0.0.1:3003/ >/dev/null 2>&1; then
              echo static ready && break;
            fi
            sleep 1
          done

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run integration tests (contract)
        run: npx jest tests/integration --runInBand --reporters=default

      - name: Run Playwright E2E (STRICT)
        env:
          TEST_BASE_URL: http://127.0.0.1:3003
          # Enable strict UI checks for this manual validation run
          TEST_STRICT_LIVE: true
        run: npx playwright test tests/playwright/live.spec.js --browser=${{ github.event.inputs.browser || 'firefox' }} --reporter=dot

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-strict
          path: |
            playwright-report
            test-results
            screenshots
            real-backend.log
            serve-proxy.log
