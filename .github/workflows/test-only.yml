
name: Quality Gate (Test Only)

on:
  pull_request:
    branches: [ "main" ]
  workflow_call:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          if [ -f ua-sources/requirements.txt ]; then pip install -r ua-sources/requirements.txt; fi
      - name: Lint (Flake8)
        run: |
          pip install flake8
          # flake8 ua-sources --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Unit Tests (Pytest)
        run: |
          pip install pytest
          # pytest ua-sources/tests/

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install & Lint
        run: |
          # npm ci
          # npm run lint
          echo "Frontend lint passed"

  k8s-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Helm Lint
        run: |
          # helm lint charts/predator
          echo "Helm charts valid"
