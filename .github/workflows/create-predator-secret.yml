name: create-predator-secrets

on:
  workflow_dispatch:
  push:
    branches:
      - copilot/ai-integration-automation-2025-12-01

jobs:
  create-secret:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure Kubeconfig
        # provide KUBE_CONFIG_DATA secret in GitHub Secrets (base64 kubeconfig)
        run: |
          echo "$KUBE_CONFIG_DATA" | base64 --decode > $HOME/.kube/config
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}

      - name: Create predator-secrets
        run: |
          kubectl -n pa-dev get ns || kubectl create ns pa-dev
          kubectl -n pa-dev create secret generic predator-secrets --from-literal=database-url="$DATABASE_URL" --from-literal=redis-url="$REDIS_URL" --from-literal=postgres-password="$POSTGRES_PASSWORD" --from-literal=redis-password="$REDIS_PASSWORD" --from-literal=grafana-admin-password="$GRAFANA_ADMIN_PASSWORD" --dry-run=client -o yaml | kubectl apply -f -
        env:
          DATABASE_URL: ${{ secrets.PREDATOR_DATABASE_URL }}
          REDIS_URL: ${{ secrets.PREDATOR_REDIS_URL }}
          POSTGRES_PASSWORD: ${{ secrets.PREDATOR_POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.PREDATOR_REDIS_PASSWORD }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.PREDATOR_GRAFANA_ADMIN_PASSWORD }}

      - name: Wait for predator-secrets to exist (poll)
        run: |
          retries=12
          for i in $(seq 1 $retries); do
            if kubectl -n pa-dev get secret predator-secrets >/dev/null 2>&1; then
              echo "predator-secrets found"
              exit 0
            fi
            echo "waiting for predator-secrets... attempt $i/$retries"
            sleep 5
          done
          echo "predator-secrets not found after $retries attempts" && exit 1

      - name: Refresh ArgoCD Application

      - name: Refresh ArgoCD Application
        # annotate to force repo-server refresh + give ArgoCD time to re-evaluate
        run: |
          kubectl -n argocd annotate application pa-platform-dev-local argocd.argoproj.io/refresh=hard --overwrite || true
          # optionally we can wait a bit for repo-server to reconcile
          sleep 5
        env:
          # requires same KUBE config (already set)
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}

      - name: Optional: argocd CLI sync PA app
        if: ${{ secrets.ARGOCD_SERVER && secrets.ARGOCD_AUTH_TOKEN }}
        run: |
          # install argocd CLI
          curl -sSL -o /usr/local/bin/argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x /usr/local/bin/argocd
          argocd --help
          # login with token (ARGOCD_SERVER should be reachable from runner via KUBECONFIG or network)
          export ARGOCD_SERVER=${{ secrets.ARGOCD_SERVER }}
          export ARGOCD_AUTH_TOKEN=${{ secrets.ARGOCD_AUTH_TOKEN }}
          # do a sync; the CLI can use token via env
          argocd app sync pa-platform-dev-local --server $ARGOCD_SERVER --auth-token $ARGOCD_AUTH_TOKEN || true
        env:
          ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
          ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
