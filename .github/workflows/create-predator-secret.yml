name: create-predator-secrets

on:
  workflow_dispatch:
  push:
    branches:
      - copilot/ai-integration-automation-2025-12-01

jobs:
  create-secret:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure Kubeconfig
        # provide KUBE_CONFIG_DATA secret in GitHub Secrets (base64 kubeconfig)
        run: |
          echo "$KUBE_CONFIG_DATA" | base64 --decode > $HOME/.kube/config
        env:
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}

      - name: Create predator-secrets
        run: |
          kubectl -n pa-dev get ns || kubectl create ns pa-dev
          kubectl -n pa-dev create secret generic predator-secrets --from-literal=database-url="$DATABASE_URL" --from-literal=redis-url="$REDIS_URL" --from-literal=postgres-password="$POSTGRES_PASSWORD" --from-literal=redis-password="$REDIS_PASSWORD" --from-literal=grafana-admin-password="$GRAFANA_ADMIN_PASSWORD" --dry-run=client -o yaml | kubectl apply -f -
        env:
          DATABASE_URL: ${{ secrets.PREDATOR_DATABASE_URL }}
          REDIS_URL: ${{ secrets.PREDATOR_REDIS_URL }}
          POSTGRES_PASSWORD: ${{ secrets.PREDATOR_POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.PREDATOR_REDIS_PASSWORD }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.PREDATOR_GRAFANA_ADMIN_PASSWORD }}

      - name: Refresh ArgoCD Application
        # annotate to force repo-server refresh + give ArgoCD time to re-evaluate
        run: |
          kubectl -n argocd annotate application pa-platform-dev-local argocd.argoproj.io/refresh=hard --overwrite || true
          # optionally we can wait a bit for repo-server to reconcile
          sleep 5
        env:
          # requires same KUBE config (already set)
          KUBE_CONFIG_DATA: ${{ secrets.KUBE_CONFIG_DATA }}
