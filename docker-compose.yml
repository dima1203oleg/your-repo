
version: '3.8'

# PREDATOR ANALYTICS v18.2 - LOCAL DEV ENVIRONMENT (MODE 3)
# Zero-Cost setup for testing on Laptop (no K8s required)

services:
  # 1. POSTGRESQL (TimeScaleDB)
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: predator-postgres
    environment:
      POSTGRES_USER: ua_service
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: predator_ua
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - predator-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ua_service"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. REDIS (Cache & Broker)
  redis:
    image: redis:7.2-alpine
    container_name: predator-redis
    ports:
      - "6379:6379"
    networks:
      - predator-net

  # 3. UA-SOURCES (Backend API)
  ua-sources-api:
    build: 
      context: ./ua-sources
      dockerfile: Dockerfile
    container_name: predator-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./ua-sources/app:/app/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://ua_service:dev_password@postgres:5432/predator_ua
      - REDIS_URL=redis://redis:6379/0
      - UA_CUSTOMS_API_KEY=dev_key_mock
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - predator-net

  # 4. CELERY WORKER (ETL)
  ua-sources-worker:
    build:
      context: ./ua-sources
      dockerfile: Dockerfile
    container_name: predator-worker
    command: celery -A app.tasks worker --loglevel=info
    volumes:
      - ./ua-sources/app:/app/app
    environment:
      - DATABASE_URL=postgresql+asyncpg://ua_service:dev_password@postgres:5432/predator_ua
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - ua-sources-api
    networks:
      - predator-net

  # 5. FRONTEND (Nexus Core) - In Dev mode, we usually run npm run dev locally, 
  # but here we can mock a container or assume it connects to localhost:8000

networks:
  predator-net:
    driver: bridge

volumes:
  postgres_data:
